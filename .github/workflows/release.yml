# 发布：推送 vX.Y.Z 标签后，三平台并行构建，自动创建带构建产物的 GitHub Release
# 产物：Android APK（通用包）+ Web 静态包 + Windows 免安装 zip；版本说明自动取自 CHANGELOG.md
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    name: 校验版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签与 pubspec 版本一致
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: //;s/+.*//')
          echo "tag=$TAG_VERSION pubspec=$PUBSPEC_VERSION"
          if [ "$TAG_VERSION" != "$PUBSPEC_VERSION" ]; then
            echo "::error::标签 v$TAG_VERSION 与 pubspec.yaml 版本 $PUBSPEC_VERSION 不一致，请先更新 pubspec.yaml"
            exit 1
          fi

  android:
    name: 构建 Android APK
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 拉取依赖并构建 APK（通用包）
        run: |
          flutter pub get
          flutter build apk --release

      - name: 重命名产物
        run: cp build/app/outputs/flutter-apk/app-release.apk "guiwu-${{ github.ref_name }}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: guiwu-*-android.apk
          if-no-files-found: error

  web:
    name: 构建 Web 包
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 拉取依赖并构建 Web
        run: |
          flutter pub get
          flutter build web --release

      - name: 打包（index.html 置于压缩包根目录，解压即可托管）
        run: |
          cd build/web
          zip -qr "../../guiwu-${{ github.ref_name }}-web.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: guiwu-*-web.zip
          if-no-files-found: error

  windows:
    name: 构建 Windows 包
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - name: 拉取依赖并构建 Windows
        run: |
          flutter pub get
          flutter build windows --release

      - name: 打包 Release 目录
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "guiwu-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: guiwu-*-windows.zip
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [validate, android, web, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从 CHANGELOG 提取版本说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "CHANGELOG.md 中没有找到 [${VERSION}] 段落，使用默认说明" >&2
            echo "归物 ${GITHUB_REF_NAME} 发布" > release_body.md
          fi
          cat release_body.md

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布产物
        run: ls -lh dist/

      - name: 创建 GitHub Release（附构建产物）
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
