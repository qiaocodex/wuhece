# CI：推送 / PR 时自动跑静态分析与单元测试
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      # window_manager→nativeapi 的 C native assets 构建需要 GTK/X11 开发头文件
      - name: 安装 Linux 桌面构建依赖
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: 静态分析
        run: flutter analyze --no-fatal-infos

      - name: 单元测试
        run: flutter test

  server-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1

      - name: BoxBook 服务端测试
        run: |
          cd server
          dart pub get
          dart analyze
          dart test
