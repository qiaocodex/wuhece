name: guiwu
description: "归物 · 个人物品资产与收纳空间管理（四端：Android / iOS / Web / Windows / macOS）"
publish_to: 'none'

version: 1.0.1+2

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 本地持久化（全平台：Android/iOS/Web/Windows/macOS）
  shared_preferences: ^2.5.0
  # 拍照 / 相册选图（Android/iOS/Web）
  image_picker: ^1.2.0
  # 桌面端文件选择 / 保存对话框（Windows/macOS/Web）
  file_selector: ^1.0.0
  # 移动端导出备份走系统分享
  share_plus: ^10.0.0
  # 纯 Dart JPEG 编码（配合 dart:ui 解码，四端通用）
  image: ^4.5.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
