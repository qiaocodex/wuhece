name: guiwu
description: "物盒册 · 个人物品资产与收纳空间管理（四端：Android / iOS / Web / Windows / macOS）"
publish_to: 'none'

version: 1.1.0+5

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 本地持久化（全平台：Android/iOS/Web/Windows/macOS）
  shared_preferences: ^2.5.0
  # 拍照 / 相册选图（Android/iOS/Web）
  image_picker: ^1.2.0
  # 桌面端文件选择 / 保存对话框（Windows/macOS/Web）
  file_selector: ^1.0.0
  # 移动端导出备份走系统分享
  share_plus: ^10.0.0
  # 纯 Dart JPEG 编码（配合 dart:ui 解码，四端通用）
  image: ^4.5.0
  # HTTP 客户端（AI 对话直连智谱开放平台）
  http: ^1.2.0
  material_ui: ^1.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 应用图标与启动屏生成（配置见下方 flutter_launcher_icons / flutter_native_splash 段）
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

flutter_launcher_icons:
  image_path: "assets/icons/icon-legacy.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#2E6B5E"
  adaptive_icon_foreground: "assets/icons/icon-foreground.png"
  web:
    generate: true
    image_path: "assets/icons/icon-legacy.png"
    background_color: "#2E6B5E"
    theme_color: "#2E6B5E"
  windows:
    generate: true
    image_path: "assets/icons/icon-legacy.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icons/icon-legacy.png"

flutter_native_splash:
  color: "#2E6B5E"
  image: "assets/icons/splash-logo.png"
  android_12:
    image: "assets/icons/splash-logo.png"
    color: "#2E6B5E"
  web: true
